name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run unit tests
        run: dotnet test tests/WindowsTaskbarMonitor.Core.Tests/WindowsTaskbarMonitor.Core.Tests.csproj --configuration Release

  windows-app:
    name: Windows x64 app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/WindowsTaskbarMonitor.App/WindowsTaskbarMonitor.App.csproj --runtime win-x64 -p:Platform=x64
      - name: Build
        run: dotnet build src/WindowsTaskbarMonitor.App/WindowsTaskbarMonitor.App.csproj --configuration Release --runtime win-x64 --no-restore -p:Platform=x64
      - name: Publish self-contained app
        run: dotnet publish src/WindowsTaskbarMonitor.App/WindowsTaskbarMonitor.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:Platform=x64 --output artifacts/TaskbarMonitor-win-x64
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor-win-x64
          path: artifacts/TaskbarMonitor-win-x64
          if-no-files-found: error
